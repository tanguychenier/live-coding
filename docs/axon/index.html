<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXON</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #070a10; color: #e8eef4;
               font-family: "DejaVu Sans Mono", ui-monospace, monospace; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; display: flex;
           flex-direction: column; align-items: center; justify-content: center; }
  /* the game fills the window, full screen included, at its own aspect ratio :
     as wide as the window allows, or as tall as the window minus the bar.
     !important, because the SDL runtime writes its own size on the element */
  canvas { display: block; outline: none;
           width: min(100vw, calc((100vh - 34px) * var(--ratio, calc(1280 / 800)))) !important;
           height: auto !important; max-width: 100vw; }
  /* full screen : nothing but the game, the bar is gone and the picture takes
     the whole screen, black bands only if the screen has another shape */
  :fullscreen #bar { display: none; }
  :fullscreen #stage { background: #000; }
  :fullscreen canvas { width: min(100vw, calc(100vh * var(--ratio, calc(1280 / 800)))) !important; }
  #loadingCanvas { display: none; }
  #splash { position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px;
            background: #070a10; cursor: pointer; user-select: none; z-index: 2; }
  #splash .brand { font-size: 44px; letter-spacing: 0.42em; font-weight: bold;
                   color: #6fe0c8; text-shadow: 0 0 24px rgba(111, 224, 200, 0.55); }
  #splash .brand span { display: inline-block; opacity: 0; transform: translateY(8px);
                        animation: rise 0.5s ease-out forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  #splash .line { width: 180px; height: 2px; background: #6fe0c8; opacity: 0;
                  animation: rise 0.6s 1.3s ease-out forwards; }
  #splash .title { color: #e8eef4; font-size: 18px; letter-spacing: 0.2em; opacity: 0;
                   animation: rise 0.6s 1.5s ease-out forwards; }
  #splash .hint { color: #8fa3b5; font-size: 14px; opacity: 0;
                  animation: rise 0.6s 1.8s ease-out forwards; }
  #bar { width: 100%; box-sizing: border-box; display: flex; gap: 18px;
         padding: 8px 16px; color: #55677a; font-size: 12px; background: #070a10; }
  /* a phone : the splash shrinks to the width, the bar wraps, and the game is
     told that it wants a keyboard */
  @media (max-width: 640px) {
    #splash { gap: 12px; padding: 0 16px; text-align: center; }
    #splash .brand { font-size: 22px; letter-spacing: 0.22em; }
    #splash select { max-width: 80vw; }
    #splash .title { font-size: 14px; letter-spacing: 0.12em; }
    #splash .hint, #splash .choix { font-size: 12px; }
    #splash .clavier { display: block; color: #8fa3b5; font-size: 12px; opacity: 0;
                       animation: rise 0.6s 2.0s ease-out forwards; }
    #bar { flex-wrap: wrap; gap: 8px 14px; font-size: 11px; padding: 8px 12px; }
    #bar .keys { flex: 1 1 100%; }
    canvas { width: 100vw !important; }
  }
  #splash .clavier { display: none; }
  #bar a { color: #8fa3b5; text-decoration: none; }
  #bar a:hover { color: #6fe0c8; }
  #bar .keys { flex: 1; }
  #splash .choix { color: #8fa3b5; font-size: 13px; margin-top: 10px; opacity: 0;
                   animation: rise 0.5s 1.9s ease-out forwards; }
  #splash select { background: #0d1420; color: #e8eef4; border: 1px solid #1c2838;
                   font: inherit; padding: 4px 6px; margin-left: 6px; }
  #bar #taille { color: #55677a; margin-left: 14px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="loadingCanvas" width="16" height="16"></canvas>
  <canvas id="canvas" width="1280" height="800" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="splash">
    <div class="brand" id="brand"></div>
    <div class="line"></div>
    <div class="title">AXON</div>
    <div class="hint" id="hint">loading</div>
    <div class="clavier">this game is played with a keyboard and a mouse</div>
    <label class="choix" id="choix-taille">picture
      <select id="taille-choisie">
        <option value="auto">automatic, grows while the machine keeps up</option>
        <option value="ecran">the whole screen</option>
        <option value="1920x1080">1920 by 1080</option>
        <option value="1280x800">1280 by 800</option>
        <option value="960x600">960 by 600</option>
      </select>
    </label>
  </div>
  <div id="bar">
    <span class="keys">arrows or mouse move the sight · hold space or click to mark, let go to fire · enter start · n sound · f11 full screen · esc leaves full screen, click the game to go back</span>
    <a href="https://www.youtube.com/playlist?list=PLFzTqIL-rNVs">watch it being written</a>
    <a href="https://github.com/tanguychenier/live-coding/tree/main/rez-like">source</a>
    <a href="../">all the games</a>
    <span id="taille"></span>
  </div>
</div>
<script>
  const brand = document.getElementById('brand');
  'TANSOFTWARE'.split('').forEach((c, i) => {
    const s = document.createElement('span');
    s.textContent = c; s.style.animationDelay = (0.08 * i) + 's';
    brand.appendChild(s);
  });
  const splash = document.getElementById('splash');
  const hint = document.getElementById('hint');
  let ready = false, started = false;
  function start() {
    if (!ready || started) return;
    started = true;
    splash.style.transition = 'opacity 0.6s';
    splash.style.opacity = '0';
    setTimeout(() => { splash.remove(); document.getElementById('canvas').focus(); }, 650);
    // the game opens full screen, from the click or the key that starts it,
    // the only moment a browser allows it. escape gives the page back, the
    // game keeps running, and a click on the canvas goes full screen again
    // safari names it with a prefix on older versions
    const plein = () => { const e = document.documentElement; const p = e.requestFullscreen || e.webkitRequestFullscreen; if (p) { try { const r = p.call(e); if (r && r.catch) r.catch(() => {}); } catch (err) {} } };
    plein();
    document.getElementById('canvas').addEventListener('click', () => { if (!document.fullscreenElement) plein(); });
    Module.callMain([]);
  }
  // the picture takes the shape of the screen : the page follows the size the
  // game gives its canvas, so that the stretch keeps the proportions
  const suivre = () => { const c = document.getElementById('canvas');
    if (c.width && c.height) c.style.setProperty('--ratio', (c.width / c.height).toString()); };
  new MutationObserver(suivre).observe(document.getElementById('canvas'), { attributes: true, attributeFilter: ['width', 'height'] });
  suivre();
  // the size of the picture : chosen on the splash, remembered, or given as
  // ?taille=ecran / ?taille=1920x1080 ; the game reads window.__tw / __th
  const choix = document.getElementById('taille-choisie');
  choix.addEventListener('click', e => e.stopPropagation());
  choix.addEventListener('keydown', e => e.stopPropagation());
  try { const m = localStorage.getItem('taille'); if (m) choix.value = m; } catch (e) {}
  const qs = new URLSearchParams(location.search).get('taille');
  if (qs) choix.value = qs;
  const poserTaille = () => {
    const v = choix.value; let w = 0, h = 0;
    if (v === 'ecran') { const d = window.devicePixelRatio || 1; w = Math.round(screen.width * d); h = Math.round(screen.height * d); }
    else if (/^\d+x\d+$/.test(v)) { [w, h] = v.split('x').map(Number); }
    window.__tw = w; window.__th = h;
    try { localStorage.setItem('taille', v); } catch (e) {}
  };
  choix.addEventListener('change', poserTaille);
  poserTaille();
  splash.addEventListener('click', start);
  window.addEventListener('keydown', e => {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
    if (!started && (e.key === 'Enter' || e.key === ' ')) start();
  });
  var Module = {
    canvas: document.getElementById('canvas'),
    noInitialRun: true,
    locateFile: function (path) { return path + '?v=807a4ae1e5'; },
    onRuntimeInitialized: function () { ready = true; hint.textContent = 'click, or press enter'; },
    // the game says at what size it draws ("picture: W by H") : shown in the
    // bar, so that a soft picture can be told from a small one
    print: function (t) { console.log(t); const m = /^picture: ([0-9]+) by ([0-9]+)/.exec(t); if (m) { const e = document.getElementById('taille'); if (e) e.textContent = 'drawn at ' + m[1] + ' by ' + m[2]; } },
    printErr: function (t) { console.error(t); },
  };
</script>
<script src="axon.js?v=807a4ae1e5"></script>
</body>
</html>
