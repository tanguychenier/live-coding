<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binding of Isaac-like</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #070a10; color: #e8eef4;
               font-family: "DejaVu Sans Mono", ui-monospace, monospace; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; display: flex;
           flex-direction: column; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; outline: none;
           max-width: 100vw; max-height: calc(100vh - 34px); }
  #loadingCanvas { display: none; }
  #splash { position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px;
            background: #070a10; cursor: pointer; user-select: none; z-index: 2; }
  #splash .brand { font-size: 44px; letter-spacing: 0.42em; font-weight: bold;
                   color: #6fe0c8; text-shadow: 0 0 24px rgba(111, 224, 200, 0.55); }
  #splash .brand span { display: inline-block; opacity: 0; transform: translateY(8px);
                        animation: rise 0.5s ease-out forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  #splash .line { width: 180px; height: 2px; background: #6fe0c8; opacity: 0;
                  animation: rise 0.6s 1.3s ease-out forwards; }
  #splash .title { color: #e8eef4; font-size: 18px; letter-spacing: 0.2em; opacity: 0;
                   animation: rise 0.6s 1.5s ease-out forwards; }
  #splash .hint { color: #8fa3b5; font-size: 14px; opacity: 0;
                  animation: rise 0.6s 1.8s ease-out forwards; }
  #bar { width: 100%; box-sizing: border-box; display: flex; gap: 18px;
         padding: 8px 16px; color: #55677a; font-size: 12px; background: #070a10; }
  #bar a { color: #8fa3b5; text-decoration: none; }
  #bar a:hover { color: #6fe0c8; }
  #bar .keys { flex: 1; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="loadingCanvas" width="16" height="16"></canvas>
  <canvas id="canvas" width="960" height="640" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="splash">
    <div class="brand" id="brand"></div>
    <div class="line"></div>
    <div class="title">BINDING OF ISAAC-LIKE</div>
    <div class="hint" id="hint">loading</div>
  </div>
  <div id="bar">
    <span class="keys">z q s d move · arrows shoot</span>
    <a href="https://youtu.be/-rA3q0Ju6_c">watch it being written</a>
    <a href="https://github.com/tanguychenier/live-coding/tree/main/binding-of-isaac-like">source</a>
    <a href="../">all the games</a>
  </div>
</div>
<script>
  const brand = document.getElementById('brand');
  'TANSOFTWARE'.split('').forEach((c, i) => {
    const s = document.createElement('span');
    s.textContent = c; s.style.animationDelay = (0.08 * i) + 's';
    brand.appendChild(s);
  });
  const splash = document.getElementById('splash');
  const hint = document.getElementById('hint');
  let ready = false, started = false;
  function start() {
    if (!ready || started) return;
    started = true;
    splash.style.transition = 'opacity 0.6s';
    splash.style.opacity = '0';
    setTimeout(() => { splash.remove(); document.getElementById('canvas').focus(); }, 650);
    document.getElementById('canvas').click();
  }
  splash.addEventListener('click', start);
  window.addEventListener('keydown', e => {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
    if (!started && (e.key === 'Enter' || e.key === ' ')) start();
  });
  var Module = {
    arguments: ["./"],
    INITIAL_MEMORY: 67108864,
    printErr: console.error.bind(console),
    canvas: document.getElementById('canvas'),
    setStatus: function (text) {
      if (!text && Module.remainingDependencies === 0) { ready = true; hint.textContent = 'click, or press enter'; }
    },
    totalDependencies: 0, remainingDependencies: 0,
    monitorRunDependencies: function (left) {
      this.remainingDependencies = left;
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? 'loading' : '');
    }
  };
  // love starts its runtime as soon as its script is here. the game runs
  // behind the splash, and the click only lifts the curtain and, in the
  // browser, lets the sound out
  function applicationLoad() { Love(Module); }
</script>
<script src="game.js"></script>
<script async src="love.js" onload="applicationLoad(this)"></script>
</body>
</html>
